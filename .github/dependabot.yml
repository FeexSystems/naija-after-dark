version: 2

# Dependency hygiene. PRODUCTION_READINESS_STATUS.md flagged an unremediated
# high-severity advisory on the default branch with no automation to catch the next
# one; these entries close that gap.
updates:
  # Backend TypeScript workspaces (backend/package.json + backend/*/package.json).
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-dev-dependencies:
        dependency-type: development
      backend-production-dependencies:
        dependency-type: production

  # Supabase Edge Functions are intentionally absent here. npc-dialogue is a single
  # index.ts with no package.json and no lockfile (Deno resolves its imports at deploy
  # time), so an npm entry has nothing to update and failed on every scheduled run.
  # When the function gains an import map or a package.json, add the entry back.

  # GitHub Actions used by the Unity and backend workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
