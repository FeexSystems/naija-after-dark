version: 2

# Dependency hygiene. PRODUCTION_READINESS_STATUS.md flagged an unremediated
# high-severity advisory on the default branch with no automation to catch the next
# one; these entries close that gap.
updates:
  # Backend TypeScript workspaces (backend/package.json + backend/*/package.json).
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-dev-dependencies:
        dependency-type: development
      backend-production-dependencies:
        dependency-type: production
    ignore:
      # @typescript-eslint/eslint-plugin@8.x peers on typescript ">=4.8.4 <6.1.0".
      # Dependabot bumped it to ^7.0.2, which fails npm ci with ERESOLVE and took
      # 'Install dependencies' down on main. Remove this once typescript-eslint
      # widens its peer range.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # Supabase Edge Functions are intentionally absent: npc-dialogue is a single
  # index.ts with no package.json and no lockfile (Deno resolves imports at deploy
  # time), so an npm entry has nothing to update and failed on every scheduled run.
  # Re-add when the function gains an import map or package.json.

  # GitHub Actions used by the Unity and backend workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
