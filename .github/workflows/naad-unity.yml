name: NAAD Unity Gate 22

on:
  push:
    branches: [main, "feat/naad-*"]
    paths:
      - "game/unity/**"
      - ".github/workflows/naad-unity.yml"
  pull_request:
    paths:
      - "game/unity/**"
      - ".github/workflows/naad-unity.yml"
  workflow_dispatch:
    inputs:
      run_live_first_night_test:
        description: "Run the live Supabase First Night test (mutates test-account state)"
        required: true
        type: boolean
        default: false

jobs:
  verify-unity:
    name: Unity compile and Gate 22 verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Unity metadata
        run: python3 tools/validate-unity-meta.py game/unity

      - name: Check Unity licensing configuration
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error::Unity licensing is not configured. Set UNITY_LICENSE, or set both UNITY_EMAIL and UNITY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          echo "Unity licensing inputs are configured."

      - name: Unity verification
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: game/unity
          # Keep this aligned with ProjectSettings/ProjectVersion.txt.
          unityVersion: 6000.6.5f1
          targetPlatform: StandaloneLinux64
          buildMethod: NAAD.Editor.NAADBuild.Verify
          customParameters: -nographics

      - name: Collect Unity diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p game/unity/Logs/ci-diagnostics
          find game/unity/Library -type f \( -name '*.log' -o -name '*.txt' \) -print 2>/dev/null \
            | head -n 50 \
            | while read -r file; do cp --parents "$file" game/unity/Logs/ci-diagnostics/; done
          for file in \
            /root/.config/unity3d/Editor.log \
            /github/home/.config/unity3d/Editor.log \
            /root/.cache/unity3d/*.log; do
            if [ -f "$file" ]; then
              cp "$file" game/unity/Logs/ci-diagnostics/"$(basename "$file")"
            fi
          done
          grep -RIn -E 'error CS|Scripts have compiler errors|Compilation failed|compiler error' \
            game/unity/Logs/ci-diagnostics || true

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naad-verification-report
          path: |
            game/unity/Logs/verification-report.json
            game/unity/Logs/ci-diagnostics
          if-no-files-found: warn

  # Additional, independent checks. These are separate jobs so that a failure in the
  # newer verification surface can never mask — or be masked by — the Gate 22 scene
  # contract above. Each mirrors a documented NAAD.Editor command from
  # Assets/NAAD/UNITY_CLI_COMMANDS.md.
  verify-project-structure:
    name: Unity project structure verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-unity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project structure
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: game/unity
          unityVersion: 6000.6.5f1
          targetPlatform: StandaloneLinux64
          buildMethod: NAAD.Editor.VerifyProject.Execute
          customParameters: -nographics

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naad-project-verification-report
          path: game/unity/Logs/verification-report.json
          if-no-files-found: warn

  # Gate C — fail the PR when the committed player rig / Animator contract is incomplete.
  # This is intentionally strict: missing FBX/clip/controller/prefab assets are a real
  # release blocker, not a warning that source inspection can waive.
  verify-animation:
    name: Gate C humanoid rig and Animator contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-unity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify humanoid rig, clips, prefab wiring, and Animator contract
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: game/unity
          unityVersion: 6000.6.5f1
          targetPlatform: StandaloneLinux64
          buildMethod: NAAD.Editor.VerifyAnimationAssets.RunVerification
          customParameters: -nographics

      - name: Upload Gate C report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naad-animation-verification-report
          path: game/unity/Logs/animation-verification-report.json
          if-no-files-found: warn

  # Package inventory is advisory only: it records what the build actually resolved,
  # which is the evidence needed to reproduce a build. A listing failure is reported
  # but does not fail the pipeline, because it cannot indicate a defect in the project.
  list-packages:
    name: Unity package inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-unity
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List installed packages
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: game/unity
          unityVersion: 6000.6.5f1
          targetPlatform: StandaloneLinux64
          buildMethod: NAAD.Editor.PackageMethods.ListPackages
          customParameters: -nographics

  # UI verification - checks UI controllers and components
  verify-ui:
    name: Unity UI verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-unity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify UI components
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: game/unity
          unityVersion: 6000.6.5f1
          targetPlatform: StandaloneLinux64
          buildMethod: NAAD.Editor.VerifyUI.Execute
          customParameters: -nographics

      - name: Upload UI verification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naad-ui-verification-report
          path: game/unity/Logs/ui-verification-report.json
          if-no-files-found: warn

  # Service verification - checks Supabase configuration and service wiring
  verify-services:
    name: Unity service verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-unity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify service configuration
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: game/unity
          unityVersion: 6000.6.5f1
          targetPlatform: StandaloneLinux64
          buildMethod: NAAD.Editor.VerifyServices.Execute
          customParameters: -nographics

      - name: Upload service verification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naad-service-verification-report
          path: game/unity/Logs/service-verification-report.json
          if-no-files-found: warn
  # Gate B / Phase D — First Night vertical slice against the LIVE Supabase project.
  # Drives the real FirstNightController through the authoritative server router
  # (sign-in → START_NIGHT → phone replies → travel → spend → COMPLETE_NIGHT → summary)
  # and asserts money-moved / spent-matches-delta / summary-shape, plus adversarial
  # probes (invalid SKU, duplicate request-id idempotency, same-location travel).
  #
  # CRITICAL: NAAD.Editor.FirstNightLiveTest is ASYNC and self-terminating — its Pump
  # handler calls EditorApplication.Exit itself (0=PASS, 2=FAULTED, 4=missing creds,
  # 5=timeout). `manualExit: true` suppresses the `-quit` game-ci injects by default;
  # without it Unity quits during import, aborts the in-flight network await, and the
  # report is never written — a silent false result. Do not remove `manualExit: true`.
  #
  # This test currently targets the configured live Supabase project and mutates
  # wallet/game state. It is therefore opt-in via workflow_dispatch, never an automatic
  # pull-request or push gate. Before making this a required CI gate, move it to an
  # isolated staging project with a disposable account and repeatable state reset.
  # Requires UNITY_* licensing and NAAD_TEST_EMAIL / NAAD_TEST_PASSWORD secrets.
  first-night-live-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_first_night_test }}
    name: First Night live end-to-end (Gate B / Phase D)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-unity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Unity licensing and First Night test-credential configuration
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          NAAD_TEST_EMAIL: ${{ secrets.NAAD_TEST_EMAIL }}
          NAAD_TEST_PASSWORD: ${{ secrets.NAAD_TEST_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error::Unity licensing is not configured. Set UNITY_LICENSE, or set both UNITY_EMAIL and UNITY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "$NAAD_TEST_EMAIL" ] || [ -z "$NAAD_TEST_PASSWORD" ]; then
            echo "::error::First Night test credentials are not configured. Set NAAD_TEST_EMAIL and NAAD_TEST_PASSWORD in GitHub Actions secrets (valid, verified credentials for the live Supabase project)."
            exit 1
          fi
          echo "Unity licensing and First Night test credentials are configured."

      - name: Run First Night live test
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          NAAD_TEST_EMAIL: ${{ secrets.NAAD_TEST_EMAIL }}
          NAAD_TEST_PASSWORD: ${{ secrets.NAAD_TEST_PASSWORD }}
        with:
          projectPath: game/unity
          # Keep this aligned with ProjectSettings/ProjectVersion.txt.
          unityVersion: 6000.6.5f1
          targetPlatform: StandaloneLinux64
          buildMethod: NAAD.Editor.FirstNightLiveTest.Run
          customParameters: -nographics
          manualExit: true

      - name: Upload First Night report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naad-first-night-report
          path: game/unity/Library/first-night-report.json
          if-no-files-found: warn
